<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TRIPSE — Document Studio</title>
  <link rel="stylesheet" href="/documents/assets/studio.css">
  <link rel="stylesheet" href="/static/module-nav.css">
  <link rel="stylesheet" href="/documents/assets/brand-tokens.css">
  <link rel="stylesheet" href="/documents/assets/marketing-editor.css">
  <script src="/documents/assets/marketing-editor.js" defer></script>
  <script src="/documents/assets/section-editor.js" defer></script>
  <link rel="stylesheet" href="/documents/assets/trip-editor.css">
  <script src="/documents/assets/trip-editor.js" defer></script>
  <script src="/documents/assets/library.js" defer></script>
  <script src="/documents/assets/source-picker.js" defer></script>
  <script src="/documents/assets/studio.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/documents/demo">TRIPSE<span>DOCUMENT STUDIO</span></a><div class="studio-topbar-actions"><a class="module-hub-link" href="/hub">← AI Hub</a><span class="local-badge">● Lokalne demo</span></div></header>
  <div class="workspace">
    <aside class="sidebar">
      <p class="eyebrow">TWOJA PRZESTRZEŃ</p>
      <nav aria-label="Główna nawigacja">
        <button data-nav="templates">Rodzaje dokumentów</button>
        <button data-nav="trips">Wycieczki <span id="trip-count"></span></button>
        <button data-nav="campaigns">Kampanie <span id="campaign-count"></span></button>
        <button data-nav="drafts">Biblioteka dokumentów <span id="draft-count"></span></button>
      </nav>
      <div class="sidebar-note"><strong>Od pomysłu do dokumentu</strong><p>Ułóż program, wybierz typ dokumentu i zachowaj jego wersję roboczą.</p><small>Dane demo są fikcyjne. Terminy i atrakcje wymagają weryfikacji.</small></div>
    </aside>
    <main id="main" tabindex="-1"><p>Wczytywanie studia…</p></main>
  </div>
  <div id="message" role="status" aria-live="polite" hidden></div>
</body>
</html>
