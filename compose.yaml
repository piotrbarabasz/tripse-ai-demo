services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/tripse.sqlite3
      DOCUMENT_STUDIO_DATA_PATH: /app/local-data/document-studio
      DOCUMENT_STUDIO_DOCKER_LOCAL: "1"
      WAHA_WEBHOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:-}
      WAHA_ALLOWED_SENDERS: ${WAHA_ALLOWED_SENDERS:-}
      WAHA_SESSION: default
      PLANNING_MODE: ${PLANNING_MODE:-live}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    volumes:
      - tripse_data:/data
      - ./local-data/document-studio:/app/local-data/document-studio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_PATH: /data/tripse.sqlite3
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      PLANNING_MODE: ${PLANNING_MODE:-live}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    volumes:
      - tripse_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  waha:
    # Version and digest checked against the official 2026.9.2 release.
    image: devlikeapro/waha:latest-2026.9.2@sha256:280bdc8f860267a2488a45d00ec88529646f7468c0bf0283c595d6efdd1b5e3b
    profiles: [whatsapp]
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_HOOK_URL: http://api:8000/api/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:-}
      WHATSAPP_HOOK_RETRIES_POLICY: constant
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "2"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "15"
    volumes:
      - waha_sessions:/app/.sessions
    # No host port: administration is accessible only inside the Docker network.
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: [dev]
    environment:
      CADDY_SITE: ${CADDY_SITE:-localhost}
      HTTPS_ORIGIN: https://${CADDY_SITE:-localhost}:${HTTPS_PORT:-8443}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tripse_data:
  waha_sessions:
  caddy_data:
  caddy_config:
