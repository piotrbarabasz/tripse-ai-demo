name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and offline contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUD_FEATURE_MODE: local
      PLANNING_MODE: mock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python and pip cache
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: make install-dev
      - name: Run pytest
        run: make test
      - name: Validate committed image source and offline deployment
        run: .venv/bin/python -m scripts.gcp.ci offline
      - name: Install headless browser
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Run browser QA
        run: make test-browser
      - run: git diff --check
      - name: Summarize pip cache and native timings
        if: always()
        env:
          PIP_CACHE_HIT: ${{ steps.python.outputs.cache-hit }}
        run: |
          case "$PIP_CACHE_HIT" in
            true) cache_state='Exact dependency-key hit (warm)' ;;
            false) cache_state='No exact hit: cold miss, fallback restore, or unavailable cache; inspect setup logs' ;;
            *) cache_state='Cache outcome unavailable (setup did not complete)' ;;
          esac
          {
            echo '### CI-001: pip cache and performance evidence'
            echo "- Cache: $cache_state"
            echo '- Cache inputs: requirements.txt and requirements-dev.txt. The virtual environment is installed in every job.'
            echo '- Timings: use native Actions job/step start and completion times for Python setup/cache restore, dependency installation, pytest/offline contracts, Chromium setup and browser QA where present.'
            echo '- Overall job duration includes post-action cache saving. A non-exact hit alone does not prove a cold cache.'
            echo '- Compare equivalent successful runs; no speedup is inferred from a cache hit.'
          } >> "$GITHUB_STEP_SUMMARY"
