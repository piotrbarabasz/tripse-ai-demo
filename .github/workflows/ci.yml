name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and offline contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUD_FEATURE_MODE: local
      PLANNING_MODE: mock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: make install-dev
      - run: make test
      - name: Validate committed image source and offline deployment
        run: .venv/bin/python -m scripts.gcp.ci offline
      - name: Install headless browser
        run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make test-browser
      - run: git diff --check
